<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cena de Acción de Gracias 2026 · CIMAJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #090807;
      --panel-bg: #12100d;
      --panel-card: #191612;
      --border-gold: rgba(212, 175, 106, 0.34);
      --gold: #d4af6a;
      --gold-light: #f0d7a2;
      --ivory: #fbf7ef;
      --cream-muted: #dfd3be;
      --whatsapp: #25d366;
      --whatsapp-dark: #1da851;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      color: var(--ivory);
      min-height: 100vh;
    }

    /* ===== BARRA SUPERIOR ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 9, 8, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-gold);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title strong {
      font-size: 13px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .brand-title span {
      font-size: 11.5px;
      color: #a99d88;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, input, textarea {
      font-family: inherit;
      background: #0d0b09;
      color: var(--ivory);
      border: 1px solid rgba(212, 175, 106, 0.32);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--gold);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(212, 175, 106, 0.38);
      background: rgba(212, 175, 106, 0.1);
      color: var(--ivory);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(212, 175, 106, 0.22);
      border-color: var(--gold-light);
    }

    .btn-gold {
      background: linear-gradient(135deg, #dfbe7d, #b58d46);
      color: #120e08;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-gold:hover {
      filter: brightness(1.07);
    }

    .btn-wa {
      background: var(--whatsapp);
      color: #07190e;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-wa:hover {
      background: var(--whatsapp-dark);
      color: #ffffff;
    }

    /* ===== LAYOUT PRINCIPAL ===== */
    .workspace {
      max-width: 1420px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 415px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ===== TARJETA VERTICAL 9:16 ===== */
    .preview-column {
      position: sticky;
      top: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .card-916 {
      width: 396px;
      height: 704px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #140d08;
      box-shadow: 0 26px 65px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(212, 175, 106, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      user-select: none;
    }

    .card-bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.34;
      filter: saturate(1.12) contrast(1.06);
      pointer-events: none;
    }

    .card-bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 12%, #000000 0%, rgba(0, 0, 0, 0.94) 24%, rgba(20, 12, 7, 0.72) 55%, rgba(10, 7, 5, 0.94) 100%);
      pointer-events: none;
    }

    .card-frame-outer {
      position: absolute;
      inset: 13px;
      border: 1.2px solid rgba(212, 175, 106, 0.65);
      border-radius: 10px;
      pointer-events: none;
      z-index: 3;
    }

    .card-frame-inner {
      position: absolute;
      inset: 18px;
      border: 0.6px solid rgba(212, 175, 106, 0.32);
      border-radius: 7px;
      pointer-events: none;
      z-index: 3;
    }

    .card-content {
      position: relative;
      z-index: 4;
      height: 100%;
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .logo-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2px;
    }

    .cimaj-logo {
      height: 82px;
      max-width: 210px;
      object-fit: contain;
      mix-blend-mode: screen;
      display: block;
    }

    .script-title {
      font-family: 'Great Vibes', cursive;
      font-size: 40px;
      line-height: 1.05;
      color: var(--gold-light);
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.7);
      margin-top: 2px;
    }

    .ornament-line {
      width: 130px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 4px auto;
    }

    .guest-block {
      width: 100%;
    }

    .guest-salutation {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .guest-name-display {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 25px;
      font-weight: 700;
      color: var(--ivory);
      line-height: 1.15;
      margin-top: 2px;
      word-break: break-word;
    }

    .invite-verse {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.38;
      color: var(--cream-muted);
      max-width: 310px;
    }

    .datetime-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid rgba(212, 175, 106, 0.35);
      border-bottom: 1px solid rgba(212, 175, 106, 0.35);
    }

    .dt-side {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .dt-center {
      padding: 0 14px;
      border-left: 1px solid rgba(212, 175, 106, 0.45);
      border-right: 1px solid rgba(212, 175, 106, 0.45);
    }

    .dt-day-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 0.95;
      color: var(--ivory);
    }

    .dt-month-year {
      font-size: 8.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 3px;
      font-weight: 600;
    }

    .venue-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .venue-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--ivory);
    }

    .address-kicker {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .address-text {
      font-size: 12px;
      line-height: 1.32;
      color: var(--cream-muted);
      max-width: 315px;
    }

    .maps-pill-btn {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(212, 175, 106, 0.16);
      border: 1px solid rgba(212, 175, 106, 0.72);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }

    .maps-pill-btn:hover {
      background: rgba(212, 175, 106, 0.28);
    }

    .dress-rsvp {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
